<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teddy Haven - Cuddles & Love in Every Hug</title>
    <script>
      window.addEventListener('error', (event) => {
        const errData = {
          message: event.message,
          filename: event.filename,
          lineno: event.lineno,
          colno: event.colno,
          stack: event.error ? event.error.stack : 'no stack'
        };
        navigator.sendBeacon('http://localhost:3000/', JSON.stringify(errData));
      });
      window.addEventListener('unhandledrejection', (event) => {
        const errData = {
          message: 'Unhandled Rejection: ' + String(event.reason),
          stack: event.reason && event.reason.stack ? event.reason.stack : 'no stack'
        };
        navigator.sendBeacon('http://localhost:3000/', JSON.stringify(errData));
      });
    </script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Particles.js library -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
